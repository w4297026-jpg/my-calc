<!-- ================= КАЛЬКУЛЯТОР РЕМОНТА С ДИЗАЙНОМ TILDA И ГАРАНТИРОВАННОЙ ЗАГРУЗКОЙ ================= -->
<div class="rp-wrap" style="max-width: 600px; margin: 40px auto; font-family: Arial, sans-serif; background: #ffffff; padding: 10px 20px; box-sizing: border-box;">
  <div id="rpLoader" style="text-align: center; color: #666666; padding: 40px 0; font-size: 16px; font-weight: 500;">Загрузка актуальных цен...</div>
  
  <div id="rpCalcBody" style="display: none;">
    <!-- Поля выбора Бренд и Модель -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 24px;">
      <div>
        <span style="display: block; font-size: 14px; color: #000000; opacity: 0.7; margin-bottom: 8px;">Бренд</span>
        <select id="rpBrand" style="width: 100%; padding: 0 15px; border: 1px solid #d6d6d6; border-radius: 0px; font-size: 16px; background: #ffffff; color: #000000; height: 50px; cursor: pointer; box-sizing: border-box;"></select>
      </div>
      <div>
        <span style="display: block; font-size: 14px; color: #000000; opacity: 0.7; margin-bottom: 8px;">Модель</span>
        <select id="rpModel" style="width: 100%; padding: 0 15px; border: 1px solid #d6d6d6; border-radius: 0px; font-size: 16px; background: #ffffff; color: #000000; height: 50px; cursor: pointer; box-sizing: border-box;"></select>
      </div>
    </div>

    <!-- Заголовок списка поломок -->
    <span style="display: block; font-size: 14px; font-weight: 700; color: #000000; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Что случилось с телефоном (можно выбрать несколько)</span>
    
    <!-- Сюда вставляются карточки поломок -->
    <div id="rpList"></div>

    <!-- Блок Итого -->
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 24px 0 20px; border-top: 1px solid #e2e2e2; margin-top: 24px;">
      <span style="font-size: 16px; font-weight: 700; color: #000000; text-transform: uppercase; letter-spacing: 1px;">Итого</span>
      <span id="rpTotal" style="font-size: 36px; font-weight: 700; color: #000000; font-variant-numeric: tabular-nums;">0 ₽</span>
    </div>

    <!-- Кнопка заявки -->
    <button id="rpCta" type="button" style="display: block; width: 100%; padding: 16px; border: none; border-radius: 0px; background: #111424; color: #ffffff; font-size: 16px; font-weight: 700; cursor: pointer; text-align: center; letter-spacing: 0.5px; transition: background 0.2s ease;">Оформить заявку</button>
  </div>
</div>

<script>
(function () {
  var SPREADSHEET_ID = "1-PJgoN7IQu75O2fDagWwYAugUvFpKzmmV8ZDSR9na1o"; 
  var FORM_ID = ""; 
  var MAILTO = "zakaz@example.com"; 

  var DATA = {}; 

  var elLoader = document.getElementById('rpLoader');
  var elCalcBody = document.getElementById('rpCalcBody');
  var elBrand = document.getElementById('rpBrand');
  var elModel = document.getElementById('rpModel');
  var elList = document.getElementById('rpList');
  var elTotal = document.getElementById('rpTotal');
  var elCta = document.getElementById('rpCta');

  // Идеально чистая ссылка строго на вашу вкладку "Лист1"
  var url = 'https://google.com' + SPREADSHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent('Лист1');

  fetch(url)
    .then(function(res) { return res.text(); })
    .then(function(text) {
      var start = text.indexOf('{');
      var end = text.lastIndexOf('}');
      if (start === -1 || end === -1) throw new Error("Неверный формат ответа Google");
      
      var jsonString = text.substring(start, end + 1);
      var json = JSON.parse(jsonString);
      
      parseGoogleJson(json);
      initCalc();
    })
    .catch(function(err) {
      console.error(err);
      elLoader.innerText = "Ошибка загрузки данных. Пожалуйста, обновите страницу.";
    });

  function parseGoogleJson(json) {
    if (!json.table || !json.table.rows) return;
    var rows = json.table.rows;

    var idxBrand = 0, idxModel = 1, idxProblem = 2, idxPrice = 3, idxDesc = 4;

    for (var i = 0; i < rows.length; i++) {
      var row = rows[i].c;
      if (!row || row.length < 4) continue;

      var brand = row[idxBrand] && row[idxBrand].v !== null ? String(row[idxBrand].v).trim() : "";
      var model = row[idxModel] && row[idxModel].v !== null ? String(row[idxModel].v).trim() : "";
      var problem = row[idxProblem] && row[idxProblem].v !== null ? String(row[idxProblem].v).trim() : "";
      var priceVal = row[idxPrice] && row[idxPrice].v !== null ? row[idxPrice].v : 0;
      var desc = row[idxDesc] && row[idxDesc].v !== null ? String(row[idxDesc].v).trim() : "";

      if (brand.toLowerCase() === 'brand' || !brand || !model || !problem) continue;

      var price = parseInt(String(priceVal).replace(/[^\d]/g, ''), 10) || 0;

      if (!DATA[brand]) DATA[brand] = {};
      if (!DATA[brand][model]) DATA[brand][model] = {};
      
      DATA[brand][model][problem] = { p: price, d: desc };
    }
  }

  function initCalc() {
    var brands = Object.keys(DATA);
    if(brands.length === 0) {
      elLoader.innerText = "Ошибка разбора таблицы. Проверьте данные.";
      return;
    }

    elLoader.style.display = 'none';
    elCalcBody.style.display = 'block';

    elBrand.innerHTML = brands.map(function(b) { return '<option value="'+b+'">'+b+'</option>'; }).join('');

    elBrand.addEventListener('change', function () {
      updateModels(this.value);
    });

    elModel.addEventListener('change', function () {
      updateProblems(elBrand.value, this.value);
    });

    updateModels(brands);
    
    elCta.addEventListener('click', function() {
      sendOrder();
    });
    
    elCta.addEventListener('mouseover', function() { this.style.background = '#232840'; });
    elCta.addEventListener('mouseout', function() { this.style.background = '#111424'; });
  }

  function updateModels(brand) {
    var models = Object.keys(DATA[brand] || {});
    elModel.innerHTML = models.map(function(m) { return '<option value="'+m+'">'+m+'</option>'; }).join('');
    if(models.length > 0) {
      updateProblems(brand, models);
    }
  }

  function updateProblems(brand, model) {
    var problems = DATA[brand] && DATA[brand][model] ? DATA[brand][model] : {};
    var html = '';
    
    for (var name in problems) {
      var item = problems[name];
      var priceStr = item.p.toLocaleString('ru-RU') + ' ₽';
      
      html += '<div class="rp-item" data-name="'+name+'" data-price="'+item.p+'" style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid #e2e2e2; margin-bottom: 12px; cursor: pointer; background: #ffffff; box-sizing: border-box;">' +
                '<input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #111111; flex-shrink: 0; cursor: pointer;">' +
                '<div style="flex: 1; min-width: 0;">' +
                  '<div style="font-size: 16px; font-weight: 700; color: #000000; letter-spacing: -0.5px;">' + name + '</div>' +
                  (item.d ? '<div style="font-size: 13px; color: #666666; margin-top: 4px; line-height: 1.4;">' + item.d + '</div>' : '') +
                '</div>' +
                '<div style="font-size: 16px; font-weight: 700; color: #000000; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px;">' + priceStr + '</div>' +
              '</div>';
    }
    elList.innerHTML = html;

    var items = elList.querySelectorAll('.rp-item');
    items.forEach(function(item) {
      item.addEventListener('click', function(e) {
        var chk = this.querySelector('input');
        if (e.target !== chk) {
          chk.checked = !chk.checked;
        }
        
        if(chk.checked) {
          this.style.borderColor = '#000000';
          this.style.background = '#f9f9f9';
        } else {
          this.style.borderColor = '#e2e2e2';
          this.style.background = '#ffffff';
        }
        calcTotal();
      });
      
      item.addEventListener('mouseover', function() {
        var chk = this.querySelector('input');
        if(!chk.checked) this.style.borderColor = '#000000';
      });
      item.addEventListener('mouseout', function() {
        var chk = this.querySelector('input');
        if(!chk.checked) this.style.borderColor = '#e2e2e2';
      });
    });

    calcTotal();
  }

  function calcTotal() {
    var total = 0;
    var checked = elList.querySelectorAll('.rp-item input:checked');
    checked.forEach(function(chk) {
      total += parseInt(chk.closest('.rp-item').getAttribute('data-price'), 10);
    });
    elTotal.innerText = total.toLocaleString('ru-RU') + ' ₽';
  }

  function sendOrder() {
    var brand = elBrand.value;
    var model = elModel.value;
    var selected = [];
    var total = elTotal.innerText;

    elList.querySelectorAll('.rp-item input:checked').forEach(function(chk) {
      selected.push(chk.closest('.rp-item').getAttribute('data-name'));
    });

    if(selected.length === 0) {
      alert('Пожалуйста, выберите хотя бы одну поломку.');
      return;
    }

    var message = "Заявка на ремонт: " + brand + " " + model + "\n" +
                  "Что починить: " + selected.join(', ') + "\n" +
                  "Стоимость: " + total;

    if (FORM_ID) {
      var formBlock = document.getElementById(FORM_ID) || document.querySelector('.' + FORM_ID);
      if (formBlock) {
        var textarea = formBlock.querySelector('textarea');
        if (textarea) {
          textarea.value = message;
          formBlock.scrollIntoView({ behavior: 'smooth' });
          return;
        }
      }
    }
    
    window.location.href = "mailto:" + MAILTO + "?subject=" + encodeURIComponent("Заявка на ремонт") + "&body=" + encodeURIComponent(message);
  }
})();
</script>
